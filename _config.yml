# The Site Configuration
theme: jekyll-theme-chirpy

# 기본 UI 언어. 영문 글은 /en/ 아래이며 상단 한/EN 스위치로 전환합니다.
lang: ko
timezone: Asia/Seoul

# SEO 및 메인 타이틀 설정
title: "Jin-Hyeong's Dev Log"
tagline: "Toss mini-apps · Flutter · AI learning notes"
description: >-
  Project notes by Jin-Hyeong Lee: Toss mini-apps, Flutter, and an AI tutor.
  Switch language with 한 / EN in the top bar.

# 주소 설정 (중요: 끝에 /를 붙이지 마세요)
url: "https://jin3402.github.io"
baseurl: ""

# 사용자 정보
github:
  username: jin3402

social:
  name: "이진형"
  email: gng09125@naver.com
  links:
    - https://github.com/jin3402

# -----------------------------------------------------------
# 아래부터는 건드리지 않고 공백으로 두어도 무방한 부분입니다.
# -----------------------------------------------------------

avatar:  'assets/img/jin.png'
paginate: 10
toc: true

# Chirpy가 About 등 탭 페이지를 만들려면 tabs 컬렉션이 필요해요.
collections:
  tabs:
    output: true
    sort_by: order

# 글 주소는 파일명 기준(/posts/gamsale/)으로 고정해요.
# 제목 기반 permalink는 한글 제목에서 주소가 비어 404가 납니다.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:slug/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Chirpy 테마 기본 설정 (건드리지 마세요)
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
