# The Site Configuration
theme: jekyll-theme-chirpy

# 언어 및 시간대 설정
lang: ko
timezone: Asia/Seoul

# SEO 및 메인 타이틀 설정
title: "Jin-Hyeong's Dev Log"
tagline: "토스 미니앱 · Flutter · AI 학습 서비스 개발 기록"
description: >-
  컴퓨터공학 전공 이진형의 기술 블로그입니다.
  토스 미니앱, Flutter, AI 학습 서비스 등 기획부터 배포까지 진행한 프로젝트를 기록합니다.

# 주소 설정 (중요: 끝에 /를 붙이지 마세요)
url: "https://jin3402.github.io"
baseurl: ""

# 사용자 정보
github:
  username: jin3402

social:
  name: "이진형"
  email: gng09125@naver.com
  links:
    - https://github.com/jin3402

# -----------------------------------------------------------
# 아래부터는 건드리지 않고 공백으로 두어도 무방한 부분입니다.
# -----------------------------------------------------------

avatar:  'assets/img/jin.png'
paginate: 10
toc: true

# Chirpy가 About 등 탭 페이지를 만들려면 tabs 컬렉션이 필요해요.
collections:
  tabs:
    output: true
    sort_by: order

# 글 주소는 파일명 기준(/posts/gamsale/)으로 고정해요.
# 제목 기반 permalink는 한글 제목에서 주소가 비어 404가 납니다.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:slug/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Chirpy 테마 기본 설정 (건드리지 마세요)
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
